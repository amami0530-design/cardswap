# Deploys the site to GitHub Pages and writes config.js from the repository variable SHEET_URL
# (Settings > Secrets and variables > Actions > Variables > New repository variable).
# Also set Settings > Pages > Source = "GitHub Actions".
name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Write config.js from the SHEET_URL variable
        env:
          SHEET_URL: ${{ vars.SHEET_URL }}
        run: |
          node -e "require('fs').writeFileSync('config.js', 'window.CRITTER_CONFIG = ' + JSON.stringify({sheet: process.env.SHEET_URL || ''}) + ';\n')"
      - name: Keep only the site files
        run: |
          mkdir _site
          cp index.html logic.js config.js _site/
          cp -r cards _site/ 2>/dev/null || true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
